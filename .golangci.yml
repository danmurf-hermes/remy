version: "2"
run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocritic
    - gosec
    - misspell
    - prealloc
    - revive
    - gofumpt
    - gocyclo
    - dupl
    - nilnil
    - mnd
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 15
    dupl:
      threshold: 150
    mnd:
      ignored-numbers: ["0", "1", "2", "100"]
    revive:
      severity: warning
      rules:
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: errorf
        - name: error-strings
        - name: error-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
          severity: error
        - name: get-return
        - name: time-naming
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: blank-imports
        - name: redefines-builtin-id
        - name: confusing-naming
        - name: confusing-results
        - name: exported
        - name: package-comments

    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
      for-loops: true
  exclusions:
    paths:
      - frontend/node_modules
    rules:
      - linters:
          - gosec
        text: "G115"
      - linters:
          - gosec
        text: "G304"
      - linters:
          - gosec
        text: "G101"
      - linters:
          - revive
        text: "blank-imports"

formatters:
  enable:
    - gofmt
