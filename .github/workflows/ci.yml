name: CI

on:
  push:
    branches: [main, 'stage-*']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Lint (golangci-lint includes govet, gofmt, and all other linters)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

      - name: Go test
        run: go test ./internal/... -cover -coverprofile=coverage.out

      - name: Frontend lint (ESLint)
        run: npx eslint --ext .js,.svelte src/
        working-directory: frontend

      - name: Frontend format check (Prettier)
        run: npx prettier --check src/
        working-directory: frontend

      - name: Frontend test
        run: npm test
        working-directory: frontend

      - name: Go build
        run: go build -ldflags="-X main.Version=$(git describe --tags 2>/dev/null || echo dev)" -o build/remy .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Ollama
        uses: ai-action/setup-ollama@v2
        with:
          model: nomic-embed-text

      - name: Run integration tests
        run: go test -tags=integration ./internal/... -cover -coverprofile=coverage-integration.out
        env:
          OLLAMA_HOST: http://localhost:11434

      - name: Upload integration coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.out
          flags: integration
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Build binary
        run: go build -ldflags="-X main.Version=$(git describe --tags 2>/dev/null || echo dev)" -o build/remy .

      - name: Set up Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Run Playwright E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          REMY_BINARY: ../../build/remy
