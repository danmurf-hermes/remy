name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12

      - name: Go test
        run: go test ./internal/... -cover

      - name: Frontend lint (ESLint)
        run: npx eslint --ext .js,.svelte src/
        working-directory: frontend

      - name: Frontend format check (Prettier)
        run: npx prettier --check src/
        working-directory: frontend

      - name: Frontend test
        run: npm test
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Build binary
        run: |
          mkdir -p build
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-X main.Version=${{ github.ref_name }} -s -w" \
            -o "build/remy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}" .
        env:
          CGO_ENABLED: 0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: remy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/remy-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG"..HEAD --oneline --no-decorate > release-notes.md
            echo "" >> release-notes.md
            echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}" >> release-notes.md
          else
            echo "Initial release of Remy ${{ github.ref_name }}" > release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/remy-linux-amd64/remy-linux-amd64
            artifacts/remy-linux-arm64/remy-linux-arm64
            artifacts/remy-darwin-amd64/remy-darwin-amd64
            artifacts/remy-darwin-arm64/remy-darwin-arm64
            artifacts/remy-windows-amd64/remy-windows-amd64.exe
          draft: false
          prerelease: false
          generate_release_notes: false
